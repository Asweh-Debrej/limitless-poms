[config]
schemaVersion = "0.0.1"


[package]
namespace = "AswehDebrej"
name = "Limitless_Poms"
versionNumber = "0.1.0"
description = "Removes Pom of Power level caps: capped boons keep getting stronger with every Pom, with diminishing returns. Installs every Limitless Poms god module."
websiteUrl = "https://github.com/AswehDebrej/Limitless_Poms"
containsNsfwContent = false

[package.dependencies]
AswehDebrej-Limitless_Poms_Hephaestus = "0.1.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

# Uncomment (remove the #) the three lines below if you have any files to copy to the plugins_data folder (like custom .pkg files)
# [[build.copy]]
# source = "./data"
# target = "./plugins_data"

[publish]
repository = "https://thunderstore.io"
communities = [ "hades-ii", ]

[publish.categories]
hades-ii = [ "mods", "modpacks" ]
