[config]
schemaVersion = "0.0.1"


[package]
namespace = "AswehDebrej"
name = "Limitless_Poms"
versionNumber = "0.1.0"
description = "Removes Pom of Power level limits: Hephaestus blasts, Zeus's Ionic Gain and Hera's Born Gain keep improving with every Pom, with diminishing returns. Configurable per god."
websiteUrl = "https://github.com/Asweh-Debrej/limitless-poms"
containsNsfwContent = false

[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.112"
LuaENVY-ENVY = "1.2.1"
SGG_Modding-ModUtil = "4.0.1"
SGG_Modding-ReLoad = "1.0.3"
SGG_Modding-Chalk = "2.1.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[[build.copy]]
source = "./src"
target = "./plugins"

[publish]
repository = "https://thunderstore.io"
communities = [ "hades-ii", ]

[publish.categories]
hades-ii = [ "mods", "gameplay" ]
